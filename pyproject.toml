[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-functional-geometry"
version = "0.1.0"
description = "Hypothesis-driven experiments on transformer compressibility and downstream functional geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Henry He"}]
dependencies = [
  "numpy>=1.24",
  "torch>=2.2",
]

[project.optional-dependencies]
experiments = ["transformers>=4.41", "matplotlib>=3.7", "tqdm>=4.66"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

